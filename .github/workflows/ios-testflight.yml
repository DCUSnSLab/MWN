# iOS 빌드 + TestFlight 업로드 (수동 실행: Actions → "iOS · Upload to TestFlight" → Run workflow).
#
# 리눅스 개발 호스트에는 Xcode 가 없으므로 GitHub 의 macOS 러너에서 아카이브·업로드한다.
#
# 필요한 GitHub Secrets (repo Settings → Secrets and variables → Actions → New repository secret):
#   GOOGLE_SERVICE_INFO_PLIST        ios/Runner/GoogleService-Info.plist 원문 (gitignored 파일 내용 그대로)
#   IOS_MAPS_API_KEY                 Google Maps iOS 키 (로컬 ios/Flutter/Secrets.xcconfig 의 MAPS_API_KEY 값)
#   IOS_CERTIFICATE_BASE64           "Apple Distribution" 인증서 .p12 를 base64 (`base64 -i cert.p12 | pbcopy`)
#   IOS_CERTIFICATE_PASSWORD         .p12 내보내기 비밀번호
#   IOS_PROVISIONING_PROFILE_B64     App Store 배포용 .mobileprovision 을 base64
#   APP_STORE_CONNECT_API_KEY_ID     App Store Connect → Users and Access → Integrations → API 키 ID
#   APP_STORE_CONNECT_API_ISSUER_ID  같은 화면의 Issuer ID
#   APP_STORE_CONNECT_API_KEY_B64    다운로드한 AuthKey_<KEY_ID>.p8 을 base64
#   API_BASE_URL                     (선택) 백엔드 URL. 비우면 앱 기본값(api_service.dart)을 쓴다
#
# teamID / 프로파일 이름 / 번들 ID 는 .mobileprovision 에서 자동 추출하므로 별도 secret 이 필요 없다.
# 빌드 번호는 기본적으로 (GitHub run number + 100) — TestFlight 는 같은 버전에 같은 빌드 번호를
# 두 번 받지 않으므로 항상 증가해야 한다. 필요하면 실행 시 build_number 입력으로 덮어쓴다.

name: iOS · Upload to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: '빌드 번호(CFBundleVersion). 비우면 run number + 100'
        required: false
        default: ''
      skip_upload:
        description: 'true 면 IPA 만 만들고 업로드는 생략 (서명 파이프라인 점검용)'
        required: false
        default: 'false'

env:
  BUNDLE_ID: snslab.cu.ac.kr.mwn

jobs:
  build-and-upload:
    runs-on: macos-15   # Xcode 16.x — Flutter 3.35 는 Xcode 16 이상을 요구한다
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.6   # .metadata revision 9f455d2486 과 동일
          cache: true

      - name: Restore gitignored config (GoogleService-Info.plist, Secrets.xcconfig)
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          MAPS_KEY: ${{ secrets.IOS_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "$PLIST" ] || { echo "::error::secret GOOGLE_SERVICE_INFO_PLIST 가 비어 있다"; exit 1; }
          [ -n "$MAPS_KEY" ] || { echo "::error::secret IOS_MAPS_API_KEY 가 비어 있다 (지도가 빈 화면이 된다)"; exit 1; }
          printf '%s' "$PLIST" > ios/Runner/GoogleService-Info.plist
          plutil -lint ios/Runner/GoogleService-Info.plist
          printf 'MAPS_API_KEY=%s\n' "$MAPS_KEY" > ios/Flutter/Secrets.xcconfig

      - name: Import signing certificate into a temporary keychain
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$CERT_B64" ] || { echo "::error::secret IOS_CERTIFICATE_BASE64 가 비어 있다"; exit 1; }
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

          echo "--- identities in keychain ---"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Apple Distribution" \
            || { echo "::error::'Apple Distribution' 인증서를 찾지 못했다. .p12 가 배포용 인증서인지 확인"; exit 1; }

      - name: Install provisioning profile & derive signing parameters
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
        run: |
          set -euo pipefail
          [ -n "$PROFILE_B64" ] || { echo "::error::secret IOS_PROVISIONING_PROFILE_B64 가 비어 있다"; exit 1; }
          PROFILE="$RUNNER_TEMP/appstore.mobileprovision"
          echo "$PROFILE_B64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"

          PB=/usr/libexec/PlistBuddy
          PROFILE_NAME=$($PB -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_UUID=$($PB -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$($PB -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          APP_ID=$($PB -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          APS_ENV=$($PB -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/profile.plist" 2>/dev/null || echo "(none)")
          echo "profile: $PROFILE_NAME ($PROFILE_UUID) team=$TEAM_ID app=$APP_ID aps=$APS_ENV"

          [ "$APP_ID" = "$TEAM_ID.$BUNDLE_ID" ] \
            || { echo "::error::프로파일의 application-identifier($APP_ID)가 $TEAM_ID.$BUNDLE_ID 와 다르다. App Store 배포용 프로파일인지 확인"; exit 1; }

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          {
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "TEAM_ID=$TEAM_ID"
            echo "APS_ENV=$APS_ENV"
          } >> "$GITHUB_ENV"

      - name: Apply manual signing to the Runner target only (via xcconfig)
        # xcodebuild 명령행에 서명 설정을 주면 Pods 프레임워크 타깃에도 적용돼 실패한다.
        # Runner 타깃의 base configuration 인 Release.xcconfig 에만 덧붙인다 (CI 작업 트리 한정, 커밋 안 함).
        run: |
          set -euo pipefail
          cat >> ios/Flutter/Release.xcconfig <<EOF

          // --- CI manual signing (appended by ios-testflight.yml) ---
          CODE_SIGN_STYLE=Manual
          DEVELOPMENT_TEAM=$TEAM_ID
          PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME
          CODE_SIGN_IDENTITY=Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*]=Apple Distribution
          EOF
          # 푸시 알림 entitlement 를 프로파일과 일치시킨다 (배포 프로파일은 production).
          if [ "$APS_ENV" = "production" ]; then
            /usr/libexec/PlistBuddy -c 'Set :aps-environment production' ios/Runner/Runner.entitlements
          fi
          cat ios/Runner/Runner.entitlements

      - name: Resolve version / build number
        run: |
          set -euo pipefail
          VERSION_LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}')   # e.g. 1.0.0+11
          BUILD_NAME=${VERSION_LINE%%+*}
          INPUT_BN='${{ github.event.inputs.build_number }}'
          if [ -n "$INPUT_BN" ]; then BUILD_NUMBER="$INPUT_BN"; else BUILD_NUMBER=$(( GITHUB_RUN_NUMBER + 100 )); fi
          echo "build-name=$BUILD_NAME build-number=$BUILD_NUMBER"
          echo "BUILD_NAME=$BUILD_NAME" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: flutter pub get / pod install
        run: |
          flutter pub get
          cd ios && pod install --repo-update

      - name: Flutter build (no codesign; archive step signs)
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          ARGS=(--release --no-codesign --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER")
          if [ -n "$API_BASE_URL" ]; then ARGS+=(--dart-define="API_BASE_URL=$API_BASE_URL"); fi
          flutter build ios "${ARGS[@]}"

      - name: xcodebuild archive
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/Runner.xcarchive \
            archive | xcpretty --no-color || { echo "::error::archive 실패 — 위 로그 확인"; exit 1; }
          test -d build/ios/Runner.xcarchive

      - name: Export IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>uploadBitcode</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          ls -la build/ios/ipa

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mwn-ios-${{ env.BUILD_NAME }}-${{ env.BUILD_NUMBER }}
          path: build/ios/ipa/*.ipa
          retention-days: 14

      - name: Upload to TestFlight (App Store Connect API)
        if: ${{ github.event.inputs.skip_upload != 'true' }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_B64 }}
        run: |
          set -euo pipefail
          [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$KEY_B64" ] \
            || { echo "::error::APP_STORE_CONNECT_API_* secrets 가 비어 있다"; exit 1; }
          mkdir -p "$HOME/private_keys"
          echo "$KEY_B64" | base64 --decode > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          echo "업로드 완료 — App Store Connect → TestFlight 에서 처리(수 분~수십 분) 후 테스터에게 배포된다."

      - name: Clean up keychain
        if: always()
        run: |
          [ -n "${KEYCHAIN_PATH:-}" ] && security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$HOME"/private_keys/AuthKey_*.p8 ios/Flutter/Secrets.xcconfig ios/Runner/GoogleService-Info.plist
