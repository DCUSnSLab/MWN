# Android 빌드 + Firebase App Distribution 자동 업로드 (초안).
#
# 작동 조건:
#   - 아래 GitHub Secrets 가 미리 설정되어 있어야 한다.
#       UPLOAD_KEYSTORE_BASE64   — android/upload-keystore.jks 를 base64 인코딩
#       KEY_PROPERTIES           — android/key.properties 원문 (storePassword/keyAlias/keyPassword/storeFile=upload-keystore.jks)
#       SECRETS_PROPERTIES       — android/secrets.properties 원문 (MAPS_API_KEY=...)
#       GOOGLE_SERVICES_JSON     — android/app/google-services.json 원문
#       FIREBASE_TOKEN           — `firebase login:ci` 출력값. App Distribution 업로드 인증.
#       API_BASE_URL             — 빌드 시 주입할 백엔드 URL (스테이징/운영)
#
# 트리거:
#   - workflow_dispatch (수동, group/notes 입력)
#   - 또는 `release/*` 브랜치 push 시 (취향에 맞게 수정)

name: Android · Distribute via Firebase

on:
  workflow_dispatch:
    inputs:
      group:
        description: '테스터 그룹 이름 (Firebase App Distribution)'
        required: true
        default: 'internal-testers'
      notes:
        description: '릴리즈 노트 (한 줄)'
        required: false
        default: ''

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    env:
      FIREBASE_APP_ID: '1:758520453995:android:9be1c6b286f449acb78a2e'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Restore secrets
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          SECRETS_PROPERTIES: ${{ secrets.SECRETS_PROPERTIES }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          printf "%s" "$KEY_PROPERTIES"       > android/key.properties
          printf "%s" "$SECRETS_PROPERTIES"   > android/secrets.properties
          printf "%s" "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: flutter pub get
        run: flutter pub get

      - name: Build AAB
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL="${API_BASE_URL}"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Distribute to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GROUP: ${{ github.event.inputs.group }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          set -euo pipefail
          ARGS=(
            firebase appdistribution:distribute
            build/app/outputs/bundle/release/app-release.aab
            --app "$FIREBASE_APP_ID"
            --groups "$GROUP"
          )
          if [[ -n "$NOTES" ]]; then
            ARGS+=(--release-notes "$NOTES")
          fi
          "${ARGS[@]}"

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
