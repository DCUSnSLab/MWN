# mwn-admin-web 컨테이너 내부 nginx 설정.
# 앞단의 mwn-nginx 가 `/admin/` 경로를 떼고(trailing slash proxy_pass) 전달하므로
# 이 컨테이너는 루트(/) 기준으로 정적 파일을 서빙한다.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 쿠버네티스 프로브용 헬스 체크
  location = /healthz {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  # Flutter Web 은 SPA — 정적 파일이 없으면 index.html 로 폴백
  location / {
    try_files $uri $uri/ /index.html;
  }
}
