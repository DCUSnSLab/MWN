# 라이브 mwn-nginx-conf ConfigMap 에 웹 관리자(/admin/) 라우팅을 추가한 버전.
#
# 주의: 이 파일은 배포 준비 시점의 라이브 ConfigMap 을 기준으로 작성됐다.
# 적용 전 `kubectl get cm mwn-nginx-conf -n mwn -o yaml` 로 라이브 내용이
# 그대로인지 확인하고, 달라졌다면 /admin/ 블록만 반영해야 한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mwn-nginx-conf
  namespace: mwn
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
      }

      # 웹 관리자 (Flutter Web). mwn-admin-web 서비스로 프록시하며,
      # trailing slash 로 /admin 접두사를 떼어 전달한다.
      location = /admin {
        return 301 /admin/;
      }
      location /admin/ {
        proxy_pass http://mwn-admin-web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location / {
        proxy_pass http://mwn-backend-internal:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
      location /map/ {
        rewrite ^/map(/.*)$ $1 break;
        proxy_pass http://scv-path-editor-service.path-editor:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
